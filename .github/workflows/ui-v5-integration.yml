name: Validate UI V5 integration

on:
  push:
    branches:
      - feature/ui-v5-integration

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply UI patch if needed
        shell: bash
        run: |
          if [ -f .github/ui_v5_patch.py ]; then
            python .github/ui_v5_patch.py
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Run tests
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Build production frontend
        env:
          CI: false
        run: npm run build

      - name: Commit validated integration
        shell: bash
        run: |
          if [ -f .github/ui_v5_patch.py ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -f .github/workflows/ui-v5-integration.yml .github/ui-v5-trigger.txt .github/ui_v5_patch.py
            git add src/LandingPage.js src/RoomPage.js src/ConfigPage.js src/GamePage.js src/GamePageEclair.js src/BlindtestUI.js src/App.css
            git commit -m "feat: integrate UI v5 across blindtest"
            git push origin feature/ui-v5-integration
          fi
