name: Validate persistent stats feature

on:
  push:
    branches:
      - feature/persistent-stats
    paths:
      - .github/workflows/validate-stats-feature.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Prepare patch selectors
        run: python scripts/repair-stats-runner.py pre

      - name: Apply integration patch
        run: node scripts/apply-stats-feature.js

      - name: Finalize generated code
        run: python scripts/repair-stats-runner.py post

      - name: Install frontend dependencies
        run: npm ci

      - name: Test answer matching
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Build frontend
        env:
          CI: false
        run: npm run build

      - name: Install persistent stats dependency
        working-directory: server
        run: npm install pg --save

      - name: Validate server files
        working-directory: server
        run: |
          node --check index.js
          node --check statsStore.js
          node --check gameSummary.js
          node -e "const s=require('./statsStore'); s.getGlobalStats().then(r=>{console.log(r.storage); process.exit(0)}).catch(e=>{console.error(e); process.exit(1)})"

      - name: Commit validated feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/validate-stats-feature.yml scripts/apply-stats-feature.js scripts/repair-stats-runner.py
          git add -A
          git commit -m "feat: persistent player statistics and smarter answers"
          git push origin feature/persistent-stats
