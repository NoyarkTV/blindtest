name: Final production validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/final-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply final timeout fix
        run: node scripts/finalize-requested-fixes.js

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend as production
        env:
          CI: "false"
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Check server syntax
        working-directory: server
        run: node --check index.js

      - name: Commit final validated code and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-validation.yml .github/workflows/validate-blindtest-fixes.yml scripts/finalize-requested-fixes.js
          git add -A
          git commit -m "fix: finalize validated blindtest corrections"
          git push origin main
