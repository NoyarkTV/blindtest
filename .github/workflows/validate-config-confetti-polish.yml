name: Validate config and confetti polish

on:
  push:
    branches:
      - feature/ui-polish-config-confetti

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply polish patch
        run: python scripts/apply-config-confetti-polish.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: CI=true npm test -- --runInBand --watchAll=false

      - name: Build production frontend
        run: CI=false npm run build

      - name: Commit validated polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.js src/BlindtestUI.js src/UiPolish.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: simplify config motion and refresh confetti"
            git push
          fi
