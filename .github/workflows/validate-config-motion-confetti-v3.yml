name: Validate config motion and confetti v3

on:
  push:
    branches:
      - feature/config-motion-confetti-v3

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply patch
        run: python scripts/apply-config-motion-confetti-v2.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: CI=true npm test -- --runInBand --watchAll=false

      - name: Build production frontend
        env:
          CI: "false"
        run: npm run build

      - name: Commit validated application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ConfigPage.js src/BlindtestUI.js src/UiPolish.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: refine config motion and end confetti"
            git push
          fi
