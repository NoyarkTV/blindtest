name: Apply requested blindtest fixes

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-requested-fixes.js
      - .github/workflows/apply-requested-fixes.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply fixes
        run: node scripts/apply-requested-fixes.js

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: scoreboard rounds penalties and config"
          git push origin main
