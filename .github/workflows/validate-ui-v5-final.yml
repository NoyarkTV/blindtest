name: Validate final UI V5

on:
  push:
    branches:
      - feature/ui-v5-final

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Build production frontend
        env:
          CI: false
        run: npm run build

      - name: Validate game summary
        working-directory: server
        shell: bash
        run: |
          node --check gameSummary.js
          node <<'NODE'
          const assert = require('assert');
          const { buildGameSummary } = require('./gameSummary');

          function gameFor(count) {
            const names = ['Thibault', 'Margaux', 'Lucas', 'Romain'].slice(0, count);
            const statsHistory = [];
            names.forEach((name, index) => {
              for (let round = 1; round <= 3; round++) {
                statsHistory.push({
                  roundNumber: round,
                  playerName: name,
                  correctTitle: round <= Math.max(1, 3 - index),
                  responseTime: 5 + index + round / 10,
                  timerSeconds: 30,
                  trackTitle: `Track ${round}`,
                  mediaHint: false,
                  yearHint: false
                });
              }
            });
            return {
              id: `ui-v5-${count}`,
              players: names.map(name => ({ name })),
              scores: names.map((name, index) => ({ name, score: 1000 - index * 100 })),
              statsHistory,
              playlist: new Array(20).fill({})
            };
          }

          for (const count of [1, 2, 4]) {
            const summary = buildGameSummary(gameFor(count));
            assert.strictEqual(summary.insights.length, Math.min(count, 3));
            assert.strictEqual(new Set(summary.insights.map(item => item.playerName)).size, summary.insights.length);
            summary.players.forEach(player => assert.strictEqual(player.roundsTotal, 20));
          }
          console.log('summary validation ok');
          NODE

      - name: Remove validation workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-ui-v5-final.yml
          git commit -m "chore: finalize validated UI v5"
          git push origin feature/ui-v5-final
